<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BQ Bot — Giả lập Messenger</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:#e9ebee; display:flex; justify-content:center; }
  .phone { width:100%; max-width:420px; height:100vh; display:flex; flex-direction:column;
           background:#fff; box-shadow:0 0 20px rgba(0,0,0,.1); }
  .hdr { background:#0084ff; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  .hdr .av { width:36px; height:36px; border-radius:50%; background:#fff; color:#0084ff;
             display:flex; align-items:center; justify-content:center; font-weight:700; }
  .hdr .name { font-weight:600; }
  .hdr .sub { font-size:12px; opacity:.85; }
  .chat { flex:1; overflow-y:auto; padding:14px; background:#fff; }
  .row { display:flex; margin:6px 0; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:78%; padding:10px 13px; border-radius:18px; white-space:pre-wrap;
            font-size:14.5px; line-height:1.4; word-wrap:break-word; }
  .bot .bubble { background:#f0f0f0; color:#111; border-bottom-left-radius:5px; }
  .me .bubble { background:#0084ff; color:#fff; border-bottom-right-radius:5px; }
  .bubble b { font-weight:700; }
  .qrs { display:flex; flex-wrap:wrap; gap:7px; padding:4px 4px 10px; }
  .qr { border:1.5px solid #0084ff; color:#0084ff; background:#fff; border-radius:16px;
        padding:6px 12px; font-size:13px; cursor:pointer; }
  .qr:hover { background:#0084ff; color:#fff; }
  .carousel { display:flex; gap:10px; overflow-x:auto; padding:6px 2px 12px; }
  .card { flex:0 0 220px; border:1px solid #e0e0e0; border-radius:12px; overflow:hidden;
          background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card img { width:100%; height:130px; object-fit:cover; display:block; background:#eee; }
  .card .body { padding:10px 12px; }
  .card .title { font-weight:600; font-size:14px; margin-bottom:3px; }
  .card .subtitle { font-size:12.5px; color:#666; }
  .card .btn { display:block; text-align:center; border-top:1px solid #eee; padding:9px;
               color:#0084ff; font-weight:600; font-size:13.5px; cursor:pointer; background:#fff; }
  .card .btn:hover { background:#f5f9ff; }
  .inp { display:flex; gap:8px; padding:10px; border-top:1px solid #eee; }
  .inp input { flex:1; border:1px solid #ddd; border-radius:20px; padding:10px 14px; font-size:14px; outline:none; }
  .inp button { border:none; background:#0084ff; color:#fff; border-radius:20px; padding:0 16px; cursor:pointer; }
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <div class="av" id="shopAv">?</div>
    <div><div class="name" id="shopName">Shop — Khách lẻ</div><div class="sub">Trợ lý bán hàng đang hoạt động (demo)</div></div>
  </div>
  <div id="chat" class="chat"></div>
  <div class="inp">
    <input id="box" placeholder="Nhập tin nhắn..." autocomplete="off">
    <button onclick="sendText()">Gửi</button>
  </div>
</div>
<script>
const SENDER = "sim-" + Math.floor(Math.random()*1e6);
// Chọn cửa hàng để demo qua URL: /fb?store=shop2 (mặc định 'default').
const STORE = new URLSearchParams(location.search).get("store") || "default";
// Chữ tắt avatar tự tính từ TÊN THẬT của cửa hàng, không hardcode "BQ" — trước đây avatar
// luôn hiện "BQ" bất kể đang xem cửa hàng nào (bug: đổi sang Cháo vẫn hiện BQ). Ưu tiên 1
// cụm viết hoa liền có sẵn trong tên (vd "Giày BQ" -> "BQ"); không có thì lấy chữ đầu của
// 2 từ đầu tên (vd "Cháo Nghêu O Hoèn" -> "CN").
function avatarFor(name){
  const clean = name.replace(/\(.*?\)/g, "").trim();
  const caps = clean.match(/\b[A-ZĐ]{2,4}\b/);
  if (caps) return caps[0];
  const words = clean.split(/\s+/).filter(Boolean);
  return ((words[0]||"?")[0] + (words[1]||"")[0]).toUpperCase();
}
// Lấy tên cửa hàng thật để hiển thị lên header (đa cửa hàng).
fetch("/api/stores").then(r=>r.json()).then(list=>{
  const s = (list||[]).find(x=>x.id===STORE);
  if (s) { document.getElementById("shopName").textContent = s.name + " — Khách lẻ";
           document.getElementById("shopAv").textContent = avatarFor(s.name);
           document.title = s.name + " — Bot"; }
}).catch(()=>{});
const chat = document.getElementById("chat");
const box = document.getElementById("box");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){return esc(s).replace(/\*(.+?)\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");}

function addBubble(text, who){
  const row=document.createElement("div"); row.className="row "+who;
  const b=document.createElement("div"); b.className="bubble"; b.innerHTML=fmt(text);
  row.appendChild(b); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}
function addQuickReplies(qrs){
  if(!qrs||!qrs.length) return;
  const wrap=document.createElement("div"); wrap.className="qrs";
  qrs.forEach(q=>{
    const el=document.createElement("div"); el.className="qr"; el.textContent=q.title;
    el.onclick=()=>{ wrap.remove(); addBubble(q.title,"me"); send(q.payload); };
    wrap.appendChild(el);
  });
  chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
}
function addCarousel(elements){
  const wrap=document.createElement("div"); wrap.className="carousel";
  elements.forEach(el=>{
    const card=document.createElement("div"); card.className="card";
    card.innerHTML = `
      ${el.image_url ? `<img src="${el.image_url}" alt="">` : ""}
      <div class="body">
        <div class="title">${esc(el.title||"")}</div>
        <div class="subtitle">${esc(el.subtitle||"")}</div>
      </div>`;
    (el.buttons||[]).forEach(b=>{
      const btn=document.createElement("div"); btn.className="btn"; btn.textContent=b.title;
      btn.onclick=()=>{ wrap.remove(); addBubble(b.title,"me"); send(b.payload); };
      card.appendChild(btn);
    });
    wrap.appendChild(card);
  });
  chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
}
async function send(text){
  const res=await fetch("/simulator/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({sender_id:SENDER,text,store_id:STORE})});
  const data=await res.json();
  (data.messages||[]).forEach(m=>{
    if(m.type==="generic"){ addCarousel(m.elements||[]); }
    else { addBubble(m.text,"bot"); }
    addQuickReplies(m.quick_replies);
  });
}
function sendText(){
  const t=box.value.trim(); if(!t) return;
  addBubble(t,"me"); box.value=""; send(t);
}
box.addEventListener("keydown",e=>{ if(e.key==="Enter") sendText(); });
// khởi động
send("menu");
</script>
</body>
</html>
